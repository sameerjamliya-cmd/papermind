version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: papermind-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: papermind
      POSTGRES_PASSWORD: papermind
      POSTGRES_DB: papermind
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
